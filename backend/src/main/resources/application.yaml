spring:
  application:
    name: wild-print-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/wildprint_db
    username: wildprint_user
    password: wildprint_dev_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-migration-naming: true

logging:
  level:
    root: INFO
    cl.wildprint: DEBUG

session:
  jdbc:
    initialize-schema: always