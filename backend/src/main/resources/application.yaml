spring:
  application:
    name: wild-print-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/wildprint_db
    username: wildprint_user
    password: wildprint_dev_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-migration-naming: true

  session:
    jdbc:
      initialize-schema: always

logging:
  level:
    root: INFO
    cl.wildprint: DEBUG

wild-print:
  # almacenamiento: r2
  almacenamiento: local
  endpoint: ${CLOUDFLARE_R2_ENDPOINT:}
  bucket: ${CLOUDFLARE_R2_BUCKET:}
  access-key: ${CLOUDFLARE_R2_ACCESS_KEY:}
  secret-key: ${CLOUDFLARE_R2_SECRET_KEY:}
  url-publica: ${CLOUDFLARE_R2_PUBLIC_URL:}