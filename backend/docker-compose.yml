
services:
  postgres:
    image: postgres:17
    container_name: wildprint-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: wildprint_db
      POSTGRES_USER: wildprint_user
      POSTGRES_PASSWORD: wildprint_dev_password
    ports:
      - "5432:5432"
    volumes:
      - wildprint_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wildprint_user -d wildprint_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  wildprint_postgres_data:
    driver: local
